---
mysqld_exporter_user: mysqld_exporter
mysqld_exporter_listen: ":9104"
mysqld_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
mysqld_exporter_release: "mysqld_exporter-{{ mysqld_exporter_version }}.linux-{{ mysqld_exporter_arch }}"
mysqld_exporter_url: "https://github.com/prometheus/mysqld_exporter/releases/download/v{{ mysqld_exporter_version }}/{{ mysqld_exporter_release }}.tar.gz"

# Database account the exporter logs in with. Create it once on the primary
# (replicates to the others):
#   CREATE USER 'exporter'@'localhost' IDENTIFIED BY '...' WITH MAX_USER_CONNECTIONS 3;
#   GRANT PROCESS, REPLICATION CLIENT, SLAVE MONITOR, SELECT ON *.* TO 'exporter'@'localhost';
mysqld_exporter_db_user: exporter
mysqld_exporter_db_password: "{{ vault_mysqld_exporter_password | default('') }}"

mysqld_exporter_collectors:
  - slave_status
  - info_schema.processlist
  - info_schema.innodb_metrics
  - global_status
  - global_variables
