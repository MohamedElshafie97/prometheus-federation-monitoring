---
- name: Refuse to deploy with empty webhook URLs
  ansible.builtin.assert:
    that: alert_dispatcher_spaces.values() | select('equalto', '') | list | length == 0
    fail_msg: "One or more Google Chat webhook URLs are empty - set them in vault"

- name: Make sure python3 is present
  ansible.builtin.package:
    name: python3
    state: present

- name: Create service user
  ansible.builtin.user:
    name: "{{ alert_dispatcher_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ alert_dispatcher_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ alert_dispatcher_dir }}", mode: "0755"}
    - {path: "{{ alert_dispatcher_config_dir }}", mode: "0750"}

- name: Install dispatcher
  ansible.builtin.copy:
    src: "{{ repo_root }}/dispatcher/alert_dispatcher.py"
    dest: "{{ alert_dispatcher_dir }}/alert_dispatcher.py"
    mode: "0755"
  notify: Restart alert-dispatcher

- name: Write config (contains webhook secrets)
  ansible.builtin.template:
    src: dispatcher.ini.j2
    dest: "{{ alert_dispatcher_config_dir }}/dispatcher.ini"
    owner: root
    group: "{{ alert_dispatcher_user }}"
    mode: "0640"
  no_log: true
  notify: Restart alert-dispatcher

- name: Install systemd unit
  ansible.builtin.copy:
    src: "{{ repo_root }}/dispatcher/alert-dispatcher.service"
    dest: /etc/systemd/system/alert-dispatcher.service
    mode: "0644"
  notify: Restart alert-dispatcher

- name: Start dispatcher
  ansible.builtin.systemd_service:
    name: alert-dispatcher
    state: started
    enabled: true
    daemon_reload: true

- name: Health check
  ansible.builtin.uri:
    url: "http://{{ alert_dispatcher_listen }}/healthz"
  register: alert_dispatcher_health
  retries: 5
  delay: 2
  until: alert_dispatcher_health.status == 200
