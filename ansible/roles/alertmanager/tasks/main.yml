---
- name: Create alertmanager user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    mode: "0750"
  loop:
    - "{{ alertmanager_config_dir }}"
    - "{{ alertmanager_config_dir }}/templates"
    - "{{ alertmanager_data_dir }}"

- name: Check installed version
  ansible.builtin.command: /usr/local/bin/alertmanager --version
  register: alertmanager_installed
  changed_when: false
  failed_when: false

- name: Install Alertmanager binaries
  when: ('version ' ~ alertmanager_version) not in (alertmanager_installed.stdout | default(''))
  block:
    - name: Download and unpack release
      ansible.builtin.unarchive:
        src: "{{ alertmanager_url }}"
        dest: /tmp
        remote_src: true

    - name: Copy alertmanager and amtool
      ansible.builtin.copy:
        src: "/tmp/{{ alertmanager_release }}/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        mode: "0755"
      loop: [alertmanager, amtool]
      notify: Restart alertmanager

- name: SMTP password file
  ansible.builtin.copy:
    dest: "{{ alertmanager_config_dir }}/smtp_password"
    content: "{{ alertmanager_smtp_password }}"
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    mode: "0600"
  no_log: true
  notify: Reload alertmanager

- name: Deploy notification templates
  ansible.builtin.copy:
    src: "{{ repo_root }}/alertmanager/templates/"
    dest: "{{ alertmanager_config_dir }}/templates/"
    owner: "{{ alertmanager_user }}"
    mode: "0644"
  notify: Reload alertmanager

- name: Deploy alertmanager.yml
  ansible.builtin.copy:
    src: "{{ repo_root }}/alertmanager/alertmanager.yml"
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: "{{ alertmanager_user }}"
    mode: "0644"
    validate: /usr/local/bin/amtool check-config %s
  notify: Reload alertmanager

- name: Deploy systemd unit
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    mode: "0644"
  notify: Restart alertmanager

- name: Start Alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    state: started
    enabled: true
    daemon_reload: true
