# kubectl apply -n monitoring -f kubernetes/prometheusrule-federation.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: federation-recording-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: prometheus-federation-monitoring
spec:
  groups:
  - name: node.recording
    rules:
    - record: instance:node_cpu_utilisation:ratio_rate5m
      expr: 1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
    - record: instance:node_memory_utilisation:ratio
      expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
    - record: instance:node_load1_per_cpu:ratio
      expr: |
        node_load1
          / on (instance, job) group_left
        count without (cpu, mode) (node_cpu_seconds_total{mode="idle"})
    - record: instance:node_filesystem_avail:ratio
      expr: |
        node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"}
          /
        node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"}
    - record: instance:node_filesystem_avail_bytes:predict_linear4h
      expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs"}[6h], 4 * 3600)
    - record: instance:node_network_errors:rate5m
      expr: |
        sum without (device) (
          rate(node_network_receive_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
          + rate(node_network_transmit_errs_total{device!~"lo|veth.*|docker.*|br-.*"}[5m])
        )
    - record: instance:node_systemd_unit_failed:count
      expr: count without (name, state, type) (node_systemd_unit_state{state="failed"} == 1)
  - name: kubernetes.federation
    rules:
    - record: cluster:kube_node_not_ready:count
      expr: count(kube_node_status_condition{condition="Ready", status="true"} == 0) or vector(0)
    - record: namespace_pod:kube_pod_container_restarts:increase1h
      expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h]))
    - record: namespace_pod:kube_pod_not_ready:count
      expr: |
        sum by (namespace, pod) (
          kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}
        ) > 0
    - record: namespace_deployment:kube_deployment_replicas_unavailable:max
      expr: max by (namespace, deployment) (kube_deployment_status_replicas_unavailable)
    - record: namespace_persistentvolumeclaim:kubelet_volume_stats_available:ratio
      expr: |
        max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes)
          /
        max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes)
    - record: namespace_job:kube_job_failed:count
      expr: sum by (namespace, job_name) (kube_job_status_failed) > 0
